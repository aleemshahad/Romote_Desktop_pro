name: Build Romte Remote (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    # Needed so the tag build can publish the EXEs to a GitHub Release.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate app icon
        run: node scripts/make-icon.js

      - name: Rebuild native modules for Electron
        # robotjs is a native module: rebuild it against the Electron ABI.
        # If it fails the server still works (mouse/keyboard control is
        # auto-disabled), so don't fail the whole build on it.
        run: npx electron-builder install-app-deps
        continue-on-error: true

      - name: Package desktop app
        # Tag builds publish the EXEs to a GitHub Release automatically
        # (releaseType "release" in package.json -> never a draft).
        # Manual runs only build + upload the workflow artifact.
        run: npx electron-builder --win ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: romte-remote-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
